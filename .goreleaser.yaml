version: 2

project_name: hddmount-tui

snapshot:
  version_template: "{{ incpatch .Version }}-devel"

before:
  hooks:
    - go mod tidy

builds:
  - id: hddmount
    main: ./cmd/hddmount
    binary: hddmount
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # Ubuntu 22.04 이상: glibc 의존성을 없앤다.
    # 외부 도구 호환성은 별도 Ubuntu 매트릭스에서 검사한다.
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: hddmount-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: hddmount-deb
    package_name: hddmount-tui
    file_name_template: >-
      {{ .ConventionalFileName }}
    vendor: Koolsign
    homepage: https://github.com/LeeAn0121/hddmount-tui
    maintainer: Koolsign <noreply@example.com>
    description: |-
      HDD를 안전하게 마운트하기 위한 TUI 도구.
      1TB/2TB/4TB/8TB 디스크 자동 감지, 파티션/포맷 이중 확인,
      fstab 자동 등록 및 검증 기능을 제공합니다.
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    section: utils
    priority: optional
    dependencies:
      - coreutils
      - parted
      - e2fsprogs
      - util-linux
      - mount
      - psmisc
    recommends:
      - smartmontools
    suggests:
      - mdadm
      - initramfs-tools

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
